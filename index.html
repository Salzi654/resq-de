<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>ResQ DE</title><style id="css">
:root{--bg:#f6f7f9;--card:#fff;--tx:#14171f;--mut:#667085;--ac:#d92d20;--bd:#e4e7ec;color-scheme:light dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

#root{max-width:960px;margin:0 auto;padding:0 16px 48px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 0;flex-wrap:wrap}

.btn{display:inline-block;background:var(--ac);color:#fff;border:0;border-radius:10px;padding:10px 16px;font:inherit;font-weight:600;cursor:pointer;text-decoration:none}
.btn.alt{background:var(--card);color:var(--tx);border:1px solid var(--bd)}.btn.big{padding:14px 26px;font-size:18px}.btn.sm{padding:6px 10px;font-size:14px}
.ban{background:var(--card);border:1px solid var(--bd);border-left:4px solid var(--ac);border-radius:10px;padding:10px 14px;margin-bottom:10px}.ban.warn{border-left-color:#f79009}
section{margin-top:36px}h2{margin:0 0 12px}h3{margin:20px 0 8px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}.tabs button{border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:999px;padding:6px 14px;font:inherit;cursor:pointer}.tabs button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.key{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px 12px}
kbd{background:var(--bg);border:1px solid var(--bd);border-bottom-width:3px;border-radius:8px;padding:4px 10px;font:600 14px ui-monospace,monospace;min-width:44px;text-align:center}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;margin-bottom:12px}.narrow{max-width:380px;margin:40px auto}
.tag{font-size:12px;font-weight:700;border-radius:6px;padding:2px 8px;background:var(--bg);border:1px solid var(--bd);margin-left:6px}
.mut{color:var(--mut)}.card p{margin:6px 0 0;white-space:pre-wrap}
label{display:block;margin:8px 0;font-size:14px;color:var(--mut)}input,select,textarea{width:100%;margin-top:4px;padding:9px 10px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font:inherit}
input[type=checkbox]{width:auto;margin:0}
.krow{display:grid;grid-template-columns:2fr 1fr auto;gap:8px;margin-bottom:8px}.krow input{margin:0}
.li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--bd);flex-wrap:wrap}
.scroll{overflow-x:auto}table{border-collapse:collapse;width:100%}td,th{padding:8px;border-bottom:1px solid var(--bd);text-align:center}td:first-child,th:first-child{text-align:left}
footer{margin-top:48px;color:var(--mut);font-size:14px;text-align:center}html{scroll-behavior:smooth}header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;backdrop-filter:blur(10px);background:color-mix(in srgb,var(--bg) 82%,transparent)}.hero{background:radial-gradient(ellipse at 50% 0,color-mix(in srgb,var(--ac) 22%,transparent),transparent 65%);border-radius:24px}.hero h1{letter-spacing:-2px}.key,.card{transition:transform .15s,box-shadow .15s}.key:hover{transform:translateY(-2px);box-shadow:0 6px 18px #0002}.key.off{opacity:.55}.kb{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:12px;margin:12px 0;overflow-x:auto}.kb-in{min-width:640px}.kr{display:flex;gap:4px;margin-bottom:4px}.kc{flex:1;text-align:center;padding:9px 2px;border-radius:7px;background:var(--bg);border:1px solid var(--bd);border-bottom-width:3px;font:600 12px ui-monospace,monospace;color:var(--mut);cursor:pointer;user-select:none;transition:.1s}.kc.on{background:color-mix(in srgb,var(--ac) 18%,var(--card));color:var(--tx);border-color:var(--ac)}.kc:hover,.kc.hit{background:var(--ac);color:#fff;transform:translateY(-2px)}.tip{min-height:44px;margin-top:8px;padding:10px 14px;border-radius:10px;background:var(--bg);border:1px solid var(--bd)}.prog{height:10px;border-radius:99px;background:var(--bd);overflow:hidden}.prog div{height:100%;background:var(--ac);transition:width .4s}#q{flex:1;min-width:160px;margin:0}.chk{display:flex;gap:6px;align-items:center;margin:0;color:var(--tx)}.pk{display:flex;align-items:center;gap:8px;margin:0}.pk input{margin:0}details.card summary{cursor:pointer;font-weight:600}.tag.new{background:var(--ac);color:#fff;border-color:var(--ac)}.btn.dis{background:var(--mut);cursor:not-allowed;opacity:.6}@media print{header,.hero,#logs,#faq,#team,footer,.ban,.tabs,#tip,.row{display:none!important}body{background:#fff;color:#000}}
</style></head><body><div id="root"></div><script id="state" type="application/json">{"links":{"play":"https://www.roblox.com","discord":"https://discord.com","youtube":""},"news":"","maint":false,"keys":{"PC":[{"a":"Vorwärts laufen","k":"W"},{"a":"Links laufen","k":"A"},{"a":"Rückwärts laufen","k":"S"},{"a":"Rechts laufen","k":"D"},{"a":"Sprinten","k":"Shift"},{"a":"MiniMap öffnen / schließen","k":"M"},{"a":"Minimap ein- / ausblenden","k":"N"},{"a":"MiniMap dreht sich mit der Kamera / Norden bleibt oben","k":"R"},{"a":"Admin Panel öffnen","k":"F2"}],"Controller":[{"a":"Bewegen","k":"Linker Stick"},{"a":"Springen","k":"A"},{"a":"Interagieren","k":"X"}],"Handy":[{"a":"Bewegen","k":"Joystick"},{"a":"Springen","k":"Sprung-Button"},{"a":"Interagieren","k":"Antippen"}]},"keysHist":[],"logs":[],"users":[],"roles":{"Admin":["keys","logs","links","maint","audit"],"Dev":["keys","logs"],"Editor":["logs"]},"audit":[]}</script><script id="app">

const DEF=JSON.stringify({PC:DK('W=Vorwärts laufen;A=Links laufen;S=Rückwärts laufen;D=Rechts laufen;Shift=Sprinten;M=MiniMap öffnen / schließen;N=Minimap ein- / ausblenden;R=MiniMap dreht sich mit der Kamera / Norden bleibt oben;F2=Admin Panel öffnen'),Controller:DK('Linker Stick=Bewegen;A=Springen;X=Interagieren'),Handy:DK('Joystick=Bewegen;Sprung-Button=Springen;Antippen=Interagieren')});
const FK=Array.from({length:12},(_,i)=>'F'+(i+1));
const GR=[['Buchstaben','ABCDEFGHIJKLMNOPQRSTUVWXYZÄÖÜß'.split('')],['Zahlen','1234567890'.split('')],['F-Tasten',FK],['Sondertasten',['Esc','Tab','Caps','Shift','Ctrl','Alt','Leertaste','Enter','Backspace','↑','←','↓','→']]];
const R1=s=>s.split('').map(k=>[k,1]);
const ROWS=[[['Esc',1],...FK.map(k=>[k,1])],[...R1('1234567890ß'),['Backspace',2]],[['Tab',1.5],...R1('QWERTZUIOPÜ')],[['Caps',1.75],...R1('ASDFGHJKLÖÄ'),['Enter',2.25]],[['Shift',2.25],...R1('YXCVBNM'),['Shift',2.75]],[['Ctrl',1.5],['Alt',1.5],['Leertaste',7],['Alt',1.5],['Ctrl',1.5],...R1('←↑↓→')]];
const act=k=>{const r=((S.keys||{}).PC||[]).find(x=>String(x.k).toLowerCase()===String(k).toLowerCase());return r&&r.a?r.a:''};

let q='',onlyOn=false,live=false,lf='Alle',me=null,view=location.hash==='#admin'?'admin':'pub',tab='keys',pt='PC',kp='PC',editId=null,artifact=null;
try{const u=sessionStorage.getItem('rq_u');if(u)me=S.users.find(x=>x.n===u)||null}catch(e){}
try{if(window.claude&&typeof window.claude.use==='function')window.claude.use('artifact').then(a=>artifact=a).catch(()=>{})}catch(e){}

async function hash(s,p){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s+':'+p));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
async function save(msg){
  S.audit.unshift({t:now(),u:me?me.n:'-',m:msg});S.audit=S.audit.slice(0,100);
  if(!artifact){alert('Speichern ist hier nicht verfügbar: Die Seite muss in claude.ai als Editor geöffnet sein.');render();return}
  const doc='<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>ResQ DE</title><style id="css">'+$('#css').textContent+'</style></head><body><div id="root"></div><script id="state" type="application/json">'+JSON.stringify(S).replace(/</g,'\\u003c')+'<\/script><script id="app">'+$('#app').textContent+'<\/script></body></html>';
  try{await artifact.publish(doc)}catch(e){alert('Speichern fehlgeschlagen: '+(e.code||e.message))}

const f=(id,l,t,v)=>`<label>${l}<input id="${id}" type="${t||'text'}" value="${esc(v)}"></label>`;
function pub(){
  const L=S.links,P=Object.keys(S.keys),logs=S.logs.filter(l=>!l.draft);
  return `<header><b class="logo">ResQ <span>DE</span></b><nav><a href="#home">Start</a><a href="#tasten">Tasten</a><a href="#logs">Dev-Logs</a></nav><button class="ico" data-act="admin" title="Admin-Bereich" aria-label="Admin-Bereich">⚙</button></header>
  ${S.maint?'<div class="ban warn">🛠 Wartungsmodus – das Spiel ist vorübergehend nicht verfügbar.</div>':''}${S.news?`<div class="ban">📣 ${esc(S.news)}</div>`:''}
  <section class="hero" id="home"><h1>ResQ DE</h1><p>Offizielle Seite des Roblox-Projekts ResQ DE.</p><div class="row"><a class="btn big" href="${esc(L.play)}" target="_blank" rel="noopener">▶ Spielen</a><a class="btn alt big" href="${esc(L.discord)}" target="_blank" rel="noopener">💬 Discord</a>${L.youtube?`<a class="btn alt big" href="${esc(L.youtube)}" target="_blank" rel="noopener">▶ YouTube</a>`:''}</div></section>
  <section id="tasten"><h2>Tastenbelegung</h2><div class="tabs">${P.map(p=>`<button class="${p===pt?'on':''}" data-act="pt" data-v="${p}">${p}</button>`).join('')}</div><div class="grid">${(S.keys[pt]||[]).map(r=>`<div class="key"><kbd>${esc(r.k)}</kbd><span>${esc(r.a)}</span></div>`).join('')}</div></section>
  <section id="logs"><h2>Dev-Logs</h2>${logs.map(l=>`<div class="card"><b>${esc(l.v)} · ${esc(l.title)}</b><span class="tag">${esc(l.tag)}</span> <span class="mut">${esc(l.date)}</span><p>${esc(l.text)}</p></div>`).join('')||'<p class="mut">Noch keine Einträge.</p>'}</section>
  <footer>ResQ DE · Fanprojekt auf Roblox</footer>`;
}
const norm=k=>k.length===1&&k!=='ß'?k.toUpperCase():k;
const tipFor=k=>{const a=act(k);return `<kbd>${esc(k)}</kbd> ${a?esc(a):'<span class="mut">/ – noch nicht belegt</span>'}`};
const klist=()=>GR.map(([g,ks])=>{const it=ks.filter(k=>{const a=act(k);return(!onlyOn||a)&&(!q||(k+' '+a).toLowerCase().includes(q))});return it.length?`<h3>${g}</h3><div class="grid">${it.map(k=>{const a=act(k);return `<div class="key${a?'':' off'}"><kbd>${esc(k)}</kbd><span>${a?esc(a):'/'}</span></div>`}).join('')}</div>`:''}).join('')||'<p class="mut">Nichts gefunden.</p>';
function pkEd(){return GR.map(([g,ks])=>`<h3>${g}</h3><div class="grid">${ks.map(k=>`<label class="pk"><kbd>${esc(k)}</kbd><input data-pk="${esc(k)}" value="${esc(act(k))}" placeholder="/"></label>`).join('')}</div>`).join('')}
function tContent(){return `<h3>FAQ</h3><label>Eine Zeile pro Eintrag: Frage | Antwort<textarea id="cf" rows="6">${esc(S.faq.map(f=>f.q+' | '+f.a).join('\n'))}</textarea></label><h3>Team</h3><label>Eine Zeile pro Person: Name | Rolle<textarea id="ct" rows="5">${esc(S.team.map(m=>m.n+' | '+m.r).join('\n'))}</textarea></label><button class="btn" data-act="csave">Speichern</button>`}
function tBackup(){return `<p class="mut">Sicherung aller Daten inklusive Benutzer. Nur für Owner, nicht weitergeben.</p><textarea id="bk" rows="8">${esc(JSON.stringify(S))}</textarea><div class="row" style="margin-top:10px"><button class="btn alt" data-act="bcopy">Kopieren</button><button class="btn" data-act="bimp">Aus Feld importieren</button></div>`}
function pub2(){

 const tot=GR.reduce((n,g)=>n+g[1].length,0),on=GR.reduce((n,g)=>n+g[1].filter(act).length,0);

 const grid=`<div class="grid">${(S.keys[pt]||[]).map(r=>`<div class="key"><kbd>${esc(r.k)}</kbd><span>${esc(r.a)}</span></div>`).join('')}</div>`;
 return `<header><b class="logo">ResQ <span>DE</span></b><nav><a href="#home">Start</a><a href="#tasten">Tasten</a><a href="#logs">Dev-Logs</a><a href="#faq">FAQ</a>${S.team.length?'<a href="#team">Team</a>':''}</nav><div class="row"><button class="ico" data-act="theme" title="Hell/Dunkel" aria-label="Hell/Dunkel">◐</button><button class="ico" data-act="admin" title="Admin-Bereich" aria-label="Admin-Bereich">⚙</button></div></header>
 ${S.maint?'<div class="ban warn">🛠 Wartungsmodus – das Spiel ist vorübergehend nicht verfügbar.</div>':''}${S.news?`<div class="ban">📣 ${esc(S.news)}</div>`:''}
 <section class="hero" id="home"><h1>ResQ DE</h1><p>Offizielle Seite des Roblox-Projekts ResQ DE.</p><div class="row">${S.maint?'<span class="btn big dis">▶ Spielen (Wartung)</span>':`<a class="btn big" href="${esc(L.play)}" target="_blank" rel="noopener">▶ Spielen</a>`}<a class="btn alt big" href="${esc(L.discord)}" target="_blank" rel="noopener">💬 Discord</a>${L.youtube?`<a class="btn alt big" href="${esc(L.youtube)}" target="_blank" rel="noopener">▶ YouTube</a>`:''}</div></section>
 <section id="tasten"><h2>Tastenbelegung</h2><div class="tabs">${P.map(p=>`<button class="${p===pt?'on':''}" data-act="pt" data-v="${p}">${p}</button>`).join('')}</div>${pt==='PC'?pcv:grid}</section>

 <footer>ResQ DE · Fanprojekt auf Roblox</footer>`;

function tKeys(){return `<div class="tabs">${Object.keys(S.keys).map(p=>`<button class="${p===kp?'on':''}" data-act="kp" data-v="${p}">${p}</button>`).join('')}</div>`+
  (kp==='PC'?pkEd():S.keys[kp].map((r,i)=>`<div class="krow"><input class="ka" value="${esc(r.a)}" placeholder="Aktion"><input class="kk" value="${esc(r.k)}" placeholder="Taste"><button class="btn alt sm" data-act="kdel" data-i="${i}">✕</button></div>`).join(''))+
  `<div class="row"><button class="btn alt sm" data-act="kadd">+ Zeile</button><button class="btn" data-act="ksave">Speichern</button><button class="btn alt sm" data-act="kreset">Auf Standard</button></div><h3>Frühere Versionen</h3>`+
  (S.keysHist.slice(0,8).map((h,i)=>`<div class="li"><span class="mut">${h.t} · ${esc(h.u)}</span><button class="btn alt sm" data-act="krest" data-i="${i}">Wiederherstellen</button></div>`).join('')||'<p class="mut">Noch keine.</p>')}
function tLogs(){const e=S.logs.find(l=>l.id===editId)||{};
  return `<h3>${e.id?'Eintrag bearbeiten':'Neuer Dev-Log'}</h3>${f('lv','Version','text',e.v)}${f('lt','Titel','text',e.title)}<label>Art<select id="lg">${['Neu','Fix','Änderung','Balance'].map(o=>`<option${o===e.tag?' selected':''}>${o}</option>`).join('')}</select></label><label>Text<textarea id="lx" rows="5">${esc(e.text)}</textarea></label><label><input type="checkbox" id="ld"${e.draft?' checked':''}> Entwurf (nicht öffentlich)</label><div class="row"><button class="btn" data-act="ladd">Speichern</button>${e.id?'<button class="btn alt" data-act="lcancel">Abbrechen</button>':''}</div><h3>Alle Einträge</h3>`+
  (S.logs.map(l=>`<div class="li"><span>${esc(l.v)} · ${esc(l.title)} ${l.draft?'<span class="tag">Entwurf</span>':''}</span><span class="row"><button class="btn alt sm" data-act="ledit" data-v="${l.id}">Bearbeiten</button><button class="btn alt sm" data-act="ldel" data-v="${l.id}">Löschen</button></span></div>`).join('')||'<p class="mut">Noch keine.</p>')}
function tLinks(){const L=S.links;return f('k1','Spielen-Link (Roblox)','url',L.play)+f('k2','Discord-Link','url',L.discord)+f('k3','YouTube-Link (optional)','url',L.youtube)+f('k4','Ankündigung auf der Startseite (leer = keine)','text',S.news)+`<button class="btn" data-act="lsave">Speichern</button>`}
function tMaint(){return `<p>Status: <b>${S.maint?'Wartungsmodus AN':'Normalbetrieb'}</b></p><button class="btn" data-act="mtoggle">${S.maint?'Wartungsmodus beenden':'Wartungsmodus aktivieren'}</button>`}
function tAudit(){return S.audit.map(a=>`<div class="li"><span>${esc(a.m)}</span><span class="mut">${esc(a.u)} · ${a.t}</span></div>`).join('')||'<p class="mut">Noch keine Einträge.</p>'}
function tUsers(){return `<h3>Benutzer erstellen</h3>${f('nu','Benutzername')}${f('np','Start-Passwort (mind. 8 Zeichen, wird bei der ersten Anmeldung geändert)','password')}<label>Rolle<select id="nr">${['Owner',...Object.keys(S.roles)].map(r=>`<option${r===dr()?' selected':''}>${r}</option>`).join('')}</select></label><button class="btn" data-act="uadd">Erstellen</button><h3>Benutzer</h3><p class="mut">Neue Benutzer legen bei der ersten Anmeldung ein eigenes Passwort fest. Wer es vergisst, bekommt von dir ein neues Start-Passwort.</p>`+
  S.users.map(u=>`<div class="li"><b>${esc(u.n)}</b>${u.n===me.n?`<span class="tag">Du · ${esc(u.role)}</span>`:`<span class="row"><select data-chg="urole" data-n="${esc(u.n)}">${['Owner',...Object.keys(S.roles)].map(r=>`<option${r===u.role?' selected':''}>${r}</option>`).join('')}</select><button class="btn alt sm" data-act="upw" data-v="${esc(u.n)}">Passwort zurücksetzen</button><button class="btn alt sm" data-act="udel" data-v="${esc(u.n)}">Löschen</button></span>`}</div>`).join('')}
function tRoles(){const R=Object.keys(S.roles);return `<div class="scroll"><table><tr><th>Recht</th><th>Owner</th>${R.map(r=>`<th>${r}</th>`).join('')}</tr>`+Object.keys(RIGHTS).map(k=>`<tr><td>${RIGHTS[k]}</td><td>✓</td>${R.map(r=>`<td><input type="checkbox" data-chg="right" data-r="${r}" data-k="${k}"${S.roles[r].includes(k)?' checked':''}></td>`).join('')}</tr>`).join('')+`</table></div><p class="mut">Owner haben immer alle Rechte, verwalten Benutzer und Rechte und können weitere Owner ernennen (unter „Benutzer“ die Rolle „Owner“ wählen).</p>`}
function render(){$('#root').innerHTML=view==='admin'?admin():pub2()}
function readKeys(){if(kp==='PC'){S.keys.PC=[...document.querySelectorAll('[data-pk]')].filter(i=>i.value.trim()).map(i=>({k:i.dataset.pk,a:i.value.trim()}));return}S.keys[kp]=[...document.querySelectorAll('.krow')].map(r=>({a:r.querySelector('.ka').value.trim(),k:r.querySelector('.kk').value.trim()})).filter(r=>r.a||r.k)}
const NEED={radd:'#o',rdel:'#o',csave:'links',bcopy:'#o',bimp:'#o',kadd:'keys',kdel:'keys',ksave:'keys',kreset:'keys',krest:'keys',ladd:'logs',ldel:'logs',ledit:'logs',lsave:'links',mtoggle:'maint',uadd:'#o',udel:'#o',upw:'#o'};
document.addEventListener('click',async e=>{
  const b=e.target.closest('[data-act]');if(!b)return;
  const a=b.dataset.act,i=+b.dataset.i,v=b.dataset.v,g=id=>($('#'+id)||{}).value||'';
  const r=NEED[a];if(r&&!(r==='#o'?isOwner():can(r)))return;
  if(a==='admin'){view='admin';location.hash='admin'}
  else if(a==='home'){view='pub';location.hash='home'}
  else if(a==='pt')pt=v;
  else if(a==='tab')tab=v;
  else if(a==='kp'){readKeys();kp=v}
  else if(a==='setup'){const n=g('su').trim(),p=g('sp');if(!n||p.length<8)return alert('Benutzername und mindestens 8 Zeichen Passwort nötig.');const s=crypto.randomUUID();S.users.push({n,s,h:await hash(s,p),role:'Owner'});me=S.users[0];try{sessionStorage.setItem('rq_u',n)}catch(x){}await save('Owner „'+n+'“ eingerichtet');return}
  else if(a==='login'){const u=S.users.find(x=>x.n===g('lu').trim());if(!u||u.h!==await hash(u.s,g('lp')))return alert('Benutzername oder Passwort falsch.');me=u;try{sessionStorage.setItem('rq_u',u.n)}catch(x){}}
  else if(a==='radd'){const n=g('rn').trim().replace(/[^\w äöüÄÖÜß.-]/g,'').slice(0,24);if(!n||n==='Owner'||S.roles[n])return alert('Name fehlt oder ist schon vergeben.');S.roles[n]=[...(S.roles[dr()]||[])];await save('Rolle „'+n+'“ erstellt');return}
  else if(a==='rdel'){if(S.users.some(u=>u.role===v))return alert('Diese Rolle ist noch Benutzern zugewiesen. Ändere zuerst deren Rolle.');if(!confirm('Rolle „'+v+'“ löschen?'))return;delete S.roles[v];if(S.defRole===v)delete S.defRole;await save('Rolle „'+v+'“ gelöscht');return}
  else if(a==='theme'){const d=document.documentElement,c=d.dataset.theme||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');d.dataset.theme=c==='dark'?'light':'dark';try{localStorage.setItem('rq_t',d.dataset.theme)}catch(x){}}
  else if(a==='live')live=!live;
  else if(a==='lf')lf=v;
  else if(a==='print'){window.print();return}
  else if(a==='csave'){const sp=t=>g(t).split('\n').map(l=>l.split('|').map(x=>x.trim())).filter(p=>p[0]);S.faq=sp('cf').map(p=>({q:p[0],a:p[1]||''}));S.team=sp('ct').map(p=>({n:p[0],r:p[1]||''}));await save('FAQ und Team geändert');return}
  else if(a==='bcopy'){try{await navigator.clipboard.writeText(g('bk'));alert('Kopiert.')}catch(x){alert('Kopieren nicht möglich. Bitte Text markieren und kopieren.')}return}
  else if(a==='bimp'){if(!confirm('Alle aktuellen Daten ersetzen?'))return;try{const d=JSON.parse(g('bk'));if(!d.keys||!Array.isArray(d.users))throw 0;Object.keys(S).forEach(k=>delete S[k]);Object.assign(S,d)}catch(x){return alert('Ungültige Daten.')}me=S.users.find(u=>me&&u.n===me.n)||null;await save('Daten importiert');return}
  else if(a==='mypw')me.mc=true;
  else if(a==='setpw'){const p=g('p1');if(p.length<8||p!==g('p2'))return alert('Mindestens 8 Zeichen, und beide Eingaben müssen gleich sein.');me.s=crypto.randomUUID();me.h=await hash(me.s,p);me.mc=false;await save('Neues Passwort gesetzt ('+me.n+')');return}
  else if(a==='logout'){me=null;try{sessionStorage.removeItem('rq_u')}catch(x){}}
  else if(a==='kadd'){readKeys();S.keys[kp].push({a:'',k:''})}
  else if(a==='kdel'){readKeys();S.keys[kp].splice(i,1)}
  else if(a==='ksave'){S.keysHist.unshift({t:now(),u:me.n,keys:JSON.parse(JSON.stringify(S.keys))});S.keysHist=S.keysHist.slice(0,15);readKeys();await save('Tastenbelegung ('+kp+') geändert');return}
  else if(a==='kreset'){if(!confirm('Alle Plattformen auf Standard zurücksetzen?'))return;S.keysHist.unshift({t:now(),u:me.n,keys:JSON.parse(JSON.stringify(S.keys))});S.keys=JSON.parse(DEF);await save('Tastenbelegung auf Standard');return}
  else if(a==='krest'){S.keys=JSON.parse(JSON.stringify(S.keysHist[i].keys));await save('Tastenbelegung wiederhergestellt');return}
  else if(a==='ladd'){const o={id:editId||String(Date.now()),v:g('lv'),title:g('lt'),tag:g('lg'),text:g('lx'),draft:$('#ld').checked,date:now().slice(0,10)};if(!o.title)return alert('Titel fehlt.');const k=S.logs.findIndex(l=>l.id===editId);if(k>=0){o.date=S.logs[k].date;S.logs[k]=o}else S.logs.unshift(o);editId=null;await save('Dev-Log „'+o.title+'“ gespeichert');return}
  else if(a==='ledit')editId=v;
  else if(a==='lcancel')editId=null;
  else if(a==='ldel'){if(!confirm('Eintrag löschen?'))return;S.logs=S.logs.filter(l=>l.id!==v);await save('Dev-Log gelöscht');return}
  else if(a==='lsave'){S.links={play:g('k1'),discord:g('k2'),youtube:g('k3')};S.news=g('k4');await save('Links und Ankündigung geändert');return}
  else if(a==='mtoggle'){S.maint=!S.maint;await save('Wartungsmodus '+(S.maint?'an':'aus'));return}
  else if(a==='uadd'){const n=g('nu').trim(),p=g('np');if(!n||p.length<8||S.users.some(x=>x.n===n))return alert('Name fehlt, schon vergeben oder Passwort zu kurz.');const s=crypto.randomUUID();S.users.push({n,s,h:await hash(s,p),role:g('nr'),mc:true});await save('Benutzer „'+n+'“ erstellt');return}
  else if(a==='udel'){if(!confirm('Benutzer löschen?'))return;S.users=S.users.filter(x=>x.n!==v);await save('Benutzer „'+v+'“ gelöscht');return}
  else if(a==='upw'){const p=prompt('Neues Start-Passwort (mind. 8 Zeichen). Die Person ändert es bei der nächsten Anmeldung:');if(!p||p.length<8)return;const u=S.users.find(x=>x.n===v);u.s=crypto.randomUUID();u.h=await hash(u.s,p);u.mc=true;await save('Passwort von „'+v+'“ zurückgesetzt');return}
  render();
});
document.addEventListener('change',async e=>{
  const c=e.target.dataset.chg;if(c==='only'){onlyOn=e.target.checked;render();return}if(!c||!isOwner())return;
  if(c==='right'){const l=S.roles[e.target.dataset.r],k=e.target.dataset.k;if(e.target.checked){if(!l.includes(k))l.push(k)}else S.roles[e.target.dataset.r]=l.filter(x=>x!==k);await save('Rechte von '+e.target.dataset.r+' geändert')}
  else if(c==='rdef'){S.defRole=e.target.value;await save('Standard-Rolle geändert')}
  else if(c==='urole'){if(e.target.dataset.n===me.n)return;S.users.find(x=>x.n===e.target.dataset.n).role=e.target.value;await save('Rolle von „'+e.target.dataset.n+'“ geändert')}
});
const KM={' ':'Leertaste',ArrowUp:'↑',ArrowDown:'↓',ArrowLeft:'←',ArrowRight:'→',Escape:'Esc',Control:'Ctrl',CapsLock:'Caps'};
document.addEventListener('mouseover',e=>{const c=e.target.closest('.kc'),t=$('#tip');if(c&&t)t.innerHTML=tipFor(c.dataset.key)});
document.addEventListener('click',e=>{const c=e.target.closest('.kc'),t=$('#tip');if(c&&t)t.innerHTML=tipFor(c.dataset.key)});
document.addEventListener('input',e=>{if(e.target.id==='q'){q=e.target.value.toLowerCase();$('#klist').innerHTML=klist()}});
document.addEventListener('keydown',e=>{if(!live||view!=='pub'||pt!=='PC'||/INPUT|TEXTAREA|SELECT/.test(e.target.tagName))return;e.preventDefault();const k=KM[e.key]||norm(e.key);document.querySelectorAll('.kc').forEach(c=>{if(c.dataset.key===k){c.classList.add('hit');setTimeout(()=>c.classList.remove('hit'),350)}});const t=$('#tip');if(t)t.innerHTML=tipFor(k)});
window.addEventListener('hashchange',()=>{view=location.hash==='#admin'?'admin':'pub';render()});
render();
</script></body></html>
